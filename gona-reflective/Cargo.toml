# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "gona_reflective"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
authors = [ "BukiOffor <ebuka2264@yahoo.com>" ]
description = "The Gonana Token on the concordium blockchain"

[features]
default = ["std"]
std = ["concordium-std/std", "concordium-cis2/std"]
bump_alloc = ["concordium-std/bump_alloc"]

[dependencies]
concordium-std = {version = "10.0.0", default-features = false}
concordium-cis2 = {version = "6.1", default-features = false, features = ["u256_amount"]}
primitive-types = {version= "0.11.1", default-features = false}


[dev-dependencies]
concordium-smart-contract-testing = "4.1"

[lib]
crate-type=["cdylib", "rlib"]

[profile.release]
codegen-units = 1
opt-level = "s"

